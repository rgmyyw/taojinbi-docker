services:
  coin11-tb:
    # 镜像 yanghai/coin11-tb:latest 在 Docker Hub 上不存在(404),也没有提交过,
    # 因此这里用 build 在目标机本地构建。首次部署:
    #   docker compose up -d --build
    # 构建后如需推送到镜像仓库供其他机器直接 pull:
    #   docker push yanghai/coin11-tb:latest
    build: .
    image: yanghai/coin11-tb:latest
    container_name: coin11-tb
    restart: unless-stopped
    network_mode: host
    # 无线ADB模式: 移除 /dev/bus/usb 挂载, 改用网络连接
    # 首次需通过有线 USB 运行 `adb tcpip 5555` 启用无线, 随后可拔除 USB
    volumes:
      # 整个项目挂载为 /scripts, 统一入口 python /scripts/main.py <任务名>
      - .:/scripts
      # adb RSA 密钥持久化: 否则每次重建容器密钥重生成, 手机端授权全部失效
      - ./.adb:/root/.android
      # easyocr 模型持久化: 否则每次重建容器后首个 OCR 任务要重新下载数十 MB 模型
      - ./.easyocr:/root/.EasyOCR
    environment:
      # 使容器内任意子目录脚本都能直接运行: 解析顶层 utils 与跨类目互相引用
      - PYTHONPATH=/scripts:/scripts/tasks/taobao:/scripts/tasks/alipay:/scripts/tasks/xianyu:/scripts/tasks/events:/scripts/tools
      # 容器以 root 运行, 避免在 bind mount 的仓库目录写出 root 属主的 __pycache__, 妨碍后续更新
      - PYTHONDONTWRITEBYTECODE=1
      # 宿主总共 4 核, 引擎 torch/OCR 全核抢占会把仪表盘 HTTP 服务饿死(浏览器表现为"日志拉取失败"),
      # 限制引擎线程数留出余量; 代价是 OCR 略慢, 属可接受权衡
      - OMP_NUM_THREADS=3
      - MKL_NUM_THREADS=2
      # 4 核宿主上 CPU OCR 慢, 默认单任务 1200s 跑不完一个浏览任务(实测 22min 超时 completed:0),
      # 放宽到 1h/任务、1.5h/轮
      - MAV_EXTRA=--task-timeout 5400 --run-timeout 7200
    # uiautomator2 通过 ADB 截图, 脚本不依赖 X11, headless 部署无需挂载。
    # 如需 GUI 显示, 取消下面两处注释:
    # volumes 追加:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    # environment:
    #   - DISPLAY=${DISPLAY}
    shm_size: "1g"
    # Mav 引擎(CPU 版 torch+easyocr)实测峰值 ~2.1G, 2G 限额会被 cgroup OOM 杀掉, 留余量取 3G
    mem_limit: 3584m
    pids_limit: 256
